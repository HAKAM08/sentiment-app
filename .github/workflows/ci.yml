
name: CI

on: [push, pull_request]

jobs:
  tp1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Environnement virtuel et dépendances
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pandas scikit-learn "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*"
          pip install -r requirements-dev.txt

      - name: Diagnostic
        run: . .venv/bin/activate && python scripts/check_setup.py

      - name: Modèle de démonstration, pour les tests de l'API (TP3)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py

      - name: ruff
        run: . .venv/bin/activate && ruff check .

      - name: mypy
        run: . .venv/bin/activate && mypy api

      - name: Tests et couverture
        run: . .venv/bin/activate && pytest -q -s --cov=api --cov-report=term-missing --cov-fail-under=95
